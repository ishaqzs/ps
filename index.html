<!DOCTYPE html>
<html lang="ps">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>پښتو</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- FontAwesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <style>
    body {
      display: flex;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background 0.3s ease;
    }

    /* SIDEBAR BASE */
    .sidebar {
      width: 260px;
      background: #f8f9fa;
      border-right: 1px solid #ddd;
      padding: 20px;
      transition: width 0.3s ease, left 0.3s ease;
    }

    /* SIDEBAR MINIMIZED (PC) */
    .sidebar.minimized {
      width: 80px;
    }

    .sidebar.minimized .text-label {
      display: none;
    }

    /* MOBILE SIDEBAR */
    @media (max-width: 991px) {
      .sidebar {
        position: fixed;
        left: -260px;
        top: 0;
        height: 100%;
        z-index: 1000;
      }
      .sidebar.sidebar-visible {
        left: 0;
      }
    }

    /* MAIN CONTENT */
    .content {
      flex: 1;
      padding: 20px;
      transition: margin-left 0.3s ease;
    }

    /* SHIFT CONTENT WHEN SIDEBAR MINIMIZED */
    .content.shifted {
      margin-left: 80px;
    }

    /* TOPBAR */
    .topbar {
      background: #fff;
      border-bottom: 1px solid #ddd;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 900;
    }

    /* DARK MODE */
    body.dark-mode {
      background: #1e1e1e;
      color: #eee;
    }
    body.dark-mode .topbar {
      background: #2b2b2b;
      border-color: #444;
    }
    body.dark-mode .sidebar {
      background: #2b2b2b;
      border-color: #444;
    }
  </style>
</head>

<body>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <h5 class="mb-3 text-label" id="sb_title">نور مالومات</h5>

    <button class="btn btn-sm btn-outline-secondary w-100 mb-3" id="minimizeSidebarBtn">
      <i class="fa-solid fa-angles-left"></i>
      <span class="text-label" id="sb_minimize">لږول</span>
    </button>

    <ul class="list-unstyled">
      <li><i class="fa-solid fa-house me-2"></i> <span class="text-label" id="sb_dashboard">د پښتو اړوند</span></li>
      <li><i class="fa-solid fa-calendar me-2"></i> <span class="text-label" id="sb_calendar">نامتو پښتانګ</span></li>
      <li><i class="fa-solid fa-table me-2"></i> <span class="text-label" id="sb_table">د پښتنو سيمو اړوند</span></li>
      <li><i class="fa-solid fa-file me-2"></i> <span class="text-label" id="sb_pages">تاريخي پښتو اسناد</span></li>
      <li><i class="fa-solid fa-gear me-2"></i> <span class="text-label" id="sb_settings">سيټینګ</span></li>
    </ul>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="content" id="content">

    <!-- TOPBAR -->
    <header class="topbar">
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-sm btn-outline-secondary d-lg-none" id="mobileSidebarBtn">
          <i class="fa-solid fa-bars"></i>
        </button>
        <h1 class="h6 mb-0" id="tb_title">پښتو</h1>
      </div>

      <div class="d-flex align-items-center gap-2">

        <!-- Theme toggle -->
        <button class="btn btn-sm btn-outline-secondary" id="themeToggleBtn">
          <i class="fa-regular fa-moon me-1"></i>
          <span class="d-none d-sm-inline" id="tb_theme">تاريکه</span>
        </button>

        <!-- Language selector -->
        <div class="dropdown">
          <button class="btn btn-sm btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown">
            <i class="fa-solid fa-globe"></i>
            <span class="d-none d-sm-inline" id="tb_language">ژبه</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><button class="dropdown-item lang-option" data-lang="ps">🇦🇫 پښتو</button></li>
            <li><button class="dropdown-item lang-option" data-lang="en">🇬🇧 English</button></li>
          </ul>
        </div>

      </div>
    </header>

    <!-- WELCOME TEXT -->
    <div class="mt-4">
      <h2 id="welcomeText">خدای دې راوله</h2>
      <p id="welcomeSubText">
پر هر کاغذ، پر هر دېوال، هم یې په مځکه ليکم
زه پر پښتو باندې مین یم پښتو ځکه ليکم </p>
    </div>

  </main>

  <!-- JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const sidebar = document.getElementById("sidebar");
    const content = document.getElementById("content");

    /* MOBILE SIDEBAR TOGGLE */
    document.getElementById("mobileSidebarBtn").addEventListener("click", () => {
      sidebar.classList.toggle("sidebar-visible");
    });

    /* PC SIDEBAR MINIMIZE */
    document.getElementById("minimizeSidebarBtn").addEventListener("click", () => {
      sidebar.classList.toggle("minimized");
      content.classList.toggle("shifted");
    });

    /* THEME TOGGLE */
    document.getElementById("themeToggleBtn").addEventListener("click", () => {
      document.body.classList.toggle("dark-mode");
    });

    /* FULL MULTILINGUAL SYSTEM */
    const ui = {
      en: {
        sb_title: "Admin Starter",
        sb_minimize: "Minimize",
        sb_dashboard: "Dashboard",
        sb_calendar: "Calendar",
        sb_table: "Data Table",
        sb_pages: "Pages",
        sb_settings: "Settings",

        tb_title: "Dashboard",
        tb_theme: "Dark",
        tb_language: "Language",

        welcomeText: "Welcome",
        welcomeSubText: "Your advanced dashboard layout is ready."
      },

      ps: {
        sb_title: "لوحة الإدارة",
        sb_minimize: "تصغير",
        sb_dashboard: "الرئيسية",
        sb_calendar: "التقويم",
        sb_table: "جدول البيانات",
        sb_pages: "الصفحات",
        sb_settings: "الإعدادات",

        tb_title: "الرئيسية",
        tb_theme: "داكن",
        tb_language: "اللغة",

        welcomeText: "مرحباً",
        welcomeSubText: "لوحة التحكم المتقدمة الخاصة بك جاهزة."
      }
    };

    function updateLanguage(lang) {
      for (const key in ui[lang]) {
        const el = document.getElementById(key);
        if (el) el.textContent = ui[lang][key];
      }

      // RTL support
      if (lang === "ps") {
        document.body.setAttribute("dir", "rtl");
      } else {
        document.body.setAttribute("dir", "ltr");
      }
    }

    document.querySelectorAll(".lang-option").forEach(btn => {
      btn.addEventListener("click", () => {
        updateLanguage(btn.dataset.lang);
      });
    });
  </script>

</body>
</html>
