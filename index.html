<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>پښتو</title>

  <!-- Persian-style thin font -->
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;200;300;400;500&display=swap" rel="stylesheet">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- FontAwesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <style>
    body {
      display: flex;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background 0.3s ease;
      font-family: 'Vazirmatn', sans-serif;
      font-weight: 300;
    }

    /* Make main content readable */
    .content {
      font-weight: 400;
    }

    /* Make headings visible */
    h1, h2, h3, h4, h5, h6 {
      font-weight: 500;
    }

    /* SIDEBAR */
    .sidebar {
      width: 260px;
      background: #f8f9fa;
      border-left: 1px solid #ddd;
      padding: 20px;
      transition: width 0.3s ease, right 0.3s ease;
    }

    .sidebar.minimized {
      width: 80px;
    }
    .sidebar.minimized .text-label {
      display: none;
    }

    @media (max-width: 991px) {
      .sidebar {
        position: fixed;
        right: -260px;
        top: 0;
        height: 100%;
        z-index: 1000;
      }
      .sidebar.sidebar-visible {
        right: 0;
      }
    }

    .content {
      flex: 1;
      padding: 20px;
      transition: margin-right 0.3s ease;
      text-align: right;
    }

    .content.shifted {
      margin-right: 80px;
    }

    .topbar {
      background: #fff;
      border-bottom: 1px solid #ddd;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 900;
      direction: rtl;
    }

    body.dark-mode {
      background: #1e1e1e;
      color: #eee;
    }
    body.dark-mode .topbar {
      background: #2b2b2b;
      border-color: #444;
    }
    body.dark-mode .sidebar {
      background: #2b2b2b;
      border-color: #444;
    }

    .ltr {
      direction: ltr;
      text-align: left;
    }
    .ltr .sidebar {
      border-right: 1px solid #ddd;
      border-left: none;
    }
    .ltr .content {
      text-align: left;
      margin-left: 0;
    }
    .ltr .topbar {
      direction: ltr;
    }

    .rtl .content {
      text-align: right;
    }
  </style>
</head>

<body class="rtl">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <h5 class="mb-3 text-label" id="sb_title">لړۍ</h5>

    <button class="btn btn-sm btn-outline-secondary w-100 mb-3" id="minimizeSidebarBtn">
      <i class="fa-solid fa-angles-right"></i>
      <span class="text-label" id="sb_minimize">لږول</span>
    </button>

    <ul class="list-unstyled">
      <li><i class="fa-solid fa-house me-2"></i> <span class="text-label" id="sb_dashboard">د پښتو په اړه</span></li>
      <li><i class="fa-solid fa-calendar me-2"></i> <span class="text-label" id="sb_calendar">پښتانه</span></li>
      <li><i class="fa-solid fa-table me-2"></i> <span class="text-label" id="sb_table">د پښتنو سيمو اړوند</span></li>
      <li><i class="fa-solid fa-file me-2"></i> <span class="text-label" id="sb_pages">تاريخي پښتو اسناد</span></li>
      <li><i class="fa-solid fa-gear me-2"></i> <span class="text-label" id="sb_settings">سيټینګ</span></li>
    </ul>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="content" id="content">

    <!-- TOPBAR -->
    <header class="topbar">
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-sm btn-outline-secondary d-lg-none" id="mobileSidebarBtn">
          <i class="fa-solid fa-bars"></i>
        </button>
        <h1 class="h6 mb-0" id="tb_title">پښتو</h1>
      </div>

      <div class="d-flex align-items-center gap-2">

        <button class="btn btn-sm btn-outline-secondary" id="themeToggleBtn">
          <i class="fa-regular fa-moon me-1"></i>
          <span class="d-none d-sm-inline" id="tb_theme">تاريکه کول</span>
        </button>

        <div class="dropdown">
          <button class="btn btn-sm btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown">
            <i class="fa-solid fa-globe"></i>
            <span class="d-none d-sm-inline" id="tb_language">ژبه</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><button class="dropdown-item lang-option" data-lang="ps">🇦🇫 پښتو</button></li>
            <li><button class="dropdown-item lang-option" data-lang="en">🇬🇧 English</button></li>
          </ul>
        </div>

      </div>
    </header>

    <!-- WELCOME TEXT -->
    <div class="mt-4">
      <h2 id="welcomeText">خدای مو راوله</h2>
      <p id="welcomeSubText">
        پر هر کاغذ، پر هر دېوال، هم یې په مځکه ليکم زه پر پښتو باندې مین یم پښتو ځکه ليکم
      </p>
    </div>

  </main>

  <!-- JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const sidebar = document.getElementById("sidebar");
    const content = document.getElementById("content");

    document.getElementById("mobileSidebarBtn").addEventListener("click", () => {
      sidebar.classList.toggle("sidebar-visible");
    });

    document.getElementById("minimizeSidebarBtn").addEventListener("click", () => {
      sidebar.classList.toggle("minimized");
      content.classList.toggle("shifted");
    });

    document.getElementById("themeToggleBtn").addEventListener("click", () => {
      document.body.classList.toggle("dark-mode");
    });

    const ui = {
      ps: {
        sb_title: "لړۍ",
        sb_minimize: "لږول",
        sb_dashboard: "د پښتو په اړه",
        sb_calendar: "پښتانه",
        sb_table: "د پښتنو سيمو اړوند",
        sb_pages: "تاريخي پښتو اسناد",
        sb_settings: "سيټینګ",

        tb_title: "پښتو",
        tb_theme: "تاريکه کول",
        tb_language: "ژبه",

        welcomeText: "خدای مو راوله",
        welcomeSubText: "پر هر کاغذ، پر هر دېوال، هم یې په مځکه ليکم زه پر پښتو باندې مین یم پښتو ځکه ليکم"
      },
      
      en: {
        sb_title: "Admin Panel",
        sb_minimize: "Minimize",
        sb_dashboard: "Dashboard",
        sb_calendar: "Calendar",
        sb_table: "Data Table",
        sb_pages: "Pages",
        sb_settings: "Settings",

        tb_title: "Dashboard",
        tb_theme: "Dark Mode",
        tb_language: "Language",

        welcomeText: "Welcome",
        welcomeSubText: "Your advanced dashboard layout is ready."
      }
    };

    function updateLanguage(lang) {
      for (const key in ui[lang]) {
        const el = document.getElementById(key);
        if (el) el.textContent = ui[lang][key];
      }

      if (lang === "ps") {
        document.body.setAttribute("dir", "rtl");
        document.body.classList.remove("ltr");
        document.body.classList.add("rtl");
      } else {
        document.body.setAttribute("dir", "ltr");
        document.body.classList.remove("rtl");
        document.body.classList.add("ltr");
      }
    }

    document.querySelectorAll(".lang-option").forEach(btn => {
      btn.addEventListener("click", () => {
        updateLanguage(btn.dataset.lang);
      });
    });
  </script>

</body>
</html>
