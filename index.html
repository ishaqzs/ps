<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
  <meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پښتو</title>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;200;300;400;500&display=swap" rel="stylesheet">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- FontAwesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <style>
    body {
      display: flex;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background 0.3s ease;
      font-family: 'Vazirmatn', sans-serif;
      font-weight: 300;
    }

    .content {
      flex: 1;
      padding: 20px;
      text-align: right;
      transition: margin-right 0.3s ease;
    }

    .sidebar {
      width: 260px;
      background: #f8f9fa;
      border-left: 1px solid #ddd;
      padding: 20px;
      transition: width 0.3s ease, right 0.3s ease;
    }

    .sidebar.minimized {
      width: 80px;
    }
    .sidebar.minimized .text-label {
      display: none;
    }

    @media (max-width: 991px) {
      .sidebar {
        position: fixed;
        right: -260px;
        top: 0;
        height: 100%;
        z-index: 1000;
      }
      .sidebar.sidebar-visible {
        right: 0;
      }
    }

    .content.shifted {
      margin-right: 80px;
    }

    .topbar {
      background: #fff;
      border-bottom: 1px solid #ddd;
      padding: 10px 20px;
      position: sticky;
      top: 0;
      z-index: 900;
    }

    .topbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .flex-order-1,
    .flex-order-2,
    .flex-order-3 {
      display: flex;
      align-items: center;
      flex: 1;
    }

    /* ⭐ SPACING ADDED HERE */
    .topbar-left {
      gap: 10px;
    }

    /* RTL ORDER (Pashto) */
    body.rtl .flex-order-1 { order: 1; justify-content: flex-start; }
    body.rtl .flex-order-2 { order: 2; justify-content: center; }
    body.rtl .flex-order-3 { order: 3; justify-content: flex-end; }

    /* LTR ORDER (English) */
    body.ltr .flex-order-1 { order: 3; justify-content: flex-end; }
    body.ltr .flex-order-2 { order: 2; justify-content: center; }
    body.ltr .flex-order-3 { order: 1; justify-content: flex-start; }

    body.dark-mode {
      background: #1e1e1e;
      color: #eee;
    }
    body.dark-mode .topbar {
      background: #2b2b2b;
      border-color: #444;
    }
    body.dark-mode .sidebar {
      background: #2b2b2b;
      border-color: #444;
    }

    /* Slide-down search bar */
    #searchBarWrapper {
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.3s ease;
    }
    #searchBarWrapper.open {
      max-height: 200px;
    }

    #searchInput {
      padding-right: 40px;
      border-radius: 24px;
    }

    #searchBarWrapper .search-icon {
      position: absolute;
      top: 50%;
      right: 14px;
      transform: translateY(-50%);
      color: #666;
    }

    #searchInput:focus {
      box-shadow: 0 0 12px rgba(0,150,255,0.5);
    }

    #searchResults div {
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hero-container {
      position: relative;
      width: 100%;
      height: 380px;
      background-image: url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee');
      background-size: cover;
      background-position: center;
      border-radius: 12px;
      overflow: hidden;
      margin-top: 20px;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(2px);
    }

    .hero-content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      max-width: 600px;
      text-align: center;
      color: white;
    }

    #welcomeText {
      font-size: 50px;
      font-weight: 700;
      letter-spacing: 1.5px;
      margin-bottom: 25px;
      text-shadow:
        0 3px 12px rgba(0,0,0,0.55),
        0 0 25px rgba(0,150,255,0.25);
    }

    /* MOBILE FIXES */
    @media (max-width: 600px) {

      .topbar {
        padding: 6px 12px;
      }

      .flex-order-1,
      .flex-order-2,
      .flex-order-3 {
        flex: unset;
      }

      .topbar-center img {
        height: 26px;
      }

      .topbar-left button,
      .topbar-left .dropdown-toggle {
        padding: 3px 6px;
        font-size: 12px;
      }

      .topbar-right button {
        padding: 3px 8px;
        font-size: 12px;
      }

      /* ⭐ MOBILE SPACING */
      .topbar-left {
        gap: 6px;
      }

      #searchInput {
        font-size: 16px;
        padding: 12px 40px 12px 12px;
      }

      #searchResults {
        font-size: 15px;
      }

      .hero-container {
        height: 260px;
      }

      #welcomeText {
        font-size: 34px;
      }
    }
  </style>
</head>

<body class="rtl">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <h5 class="mb-3 text-label" id="sb_title">لړۍ</h5>

    <button class="btn btn-sm btn-outline-secondary w-100 mb-3" id="minimizeSidebarBtn">
      <i class="fa-solid fa-angles-right"></i>
      <span class="text-label" id="sb_minimize">لږول</span>
    </button>

    <ul class="list-unstyled">
      <li><i class="fa-solid fa-globe"></i> <span class="text-label" id="sb_dashboard">د پښتو په اړه</span></li>
      <li><i class="fa-solid fa-users"></i> <span class="text-label" id="sb_calendar">پښتانه</span></li>
      <li><i class="fa-solid fa-route"></i> <span class="text-label" id="sb_table">پښتنې سيمي</span></li>
      <li><i class="fa-regular fa-id-badge"></i> <span class="text-label" id="sb_pages">پښتو نومونه</span></li>
      <li><i class="fa-solid fa-gear me-2"></i> <span class="text-label" id="sb_settings">سيټینګ</span></li>
    </ul>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="content" id="content">

    <!-- TOPBAR -->
    <header class="topbar">
      <div class="topbar-inner">

        <!-- LEFT (Pashto) / RIGHT (English): Theme + Language -->
        <div class="flex-order-1 topbar-left">
          <button class="btn btn-sm btn-outline-secondary" id="themeToggleBtn">
            <i class="fa-regular fa-moon me-1"></i>
            <span class="d-none d-sm-inline" id="tb_theme">تاريکه کول</span>
          </button>

          <div class="dropdown">
            <button class="btn btn-sm btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown">
              <i class="fa-solid fa-globe"></i>
              <span class="d-none d-sm-inline" id="tb_language">ژبه</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><button class="dropdown-item lang-option" data-lang="ps">🇦🇫 پښتو</button></li>
              <li><button class="dropdown-item lang-option" data-lang="en">🇬🇧 English</button></li>
            </ul>
          </div>
        </div>

        <!-- CENTER: Logo -->
        <div class="flex-order-2 topbar-center">
          <img src="https://upload.wikimedia.org/wikipedia/commons/4/44/The_Pashto.png"
               alt="Logo"
               style="height:32px; width:auto;">
        </div>

        <!-- RIGHT (Pashto) / LEFT (English): Search Button -->
        <div class="flex-order-3 topbar-right">
          <button class="btn btn-sm btn-outline-secondary" id="searchToggleBtn">
            <i class="fa-solid fa-magnifying-glass me-1"></i>
            <span id="searchButtonLabel">لټون</span>
          </button>
        </div>

      </div>
    </header>

    <!-- SLIDE-DOWN SEARCH BAR -->
    <div id="searchBarWrapper" class="mt-2">
      <div class="position-relative">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input 
          type="text" 
          id="searchInput" 
          placeholder="لټون…" 
          class="form-control" 
        >
      </div>
      <div id="searchResults" class="mt-2 text-end"></div>
    </div>

    <!-- HERO IMAGE SECTION -->
    <div class="hero-container">
      <div class="hero-overlay"></div>
      <div class="hero-content">
        <h2 id="welcomeText">خدای مو راوله</h2>
      </div>
    </div>

    <!-- FOOTER -->
    <p class="mt-2 mb-0" style="font-size: 14px;">
      ©2026 PASHTO.af
    </p>

  </main>

  <!-- JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const myContent = [
      { title: "د پښتو په اړه", text: "پښتو د افغانانو لرغونې ژبه ده." },
      { title: "پښتانه", text: "پښتانه د نړۍ یو لوی قوم دۍ." },
      { title: "تاريخي پښتو اسناد", text: "دلته د پښتو تاریخ اسناد موندل کېږي." }
    ];

    let currentLang = "ps";

    /* SEARCH ENGINE */
    function updateSearchResults(q) {
      const box = document.getElementById("searchResults");

      if (q === "") {
        box.innerHTML = "";
        return;
      }

      const found = myContent.filter(item =>
        item.title.toLowerCase().includes(q) ||
        item.text.toLowerCase().includes(q)
      );

      if (found.length === 0) {
        box.innerHTML = `<p class="mt-2">${ui[currentLang].noResult}</p>`;
        return;
      }

      box.innerHTML = found
        .map(item => `<div class="p-2 border rounded mb-1"><strong>${item.title}</strong><br>${item.text}</div>`)
        .join("");
    }

    document.getElementById("searchInput").addEventListener("input", function () {
      updateSearchResults(this.value.trim().toLowerCase());
    });

    /* SEARCH TOGGLE */
    const searchBarWrapper = document.getElementById("searchBarWrapper");
    const searchToggleBtn = document.getElementById("searchToggleBtn");

    searchToggleBtn.addEventListener("click", () => {
      searchBarWrapper.classList.toggle("open");
      if (searchBarWrapper.classList.contains("open")) {
        setTimeout(() => document.getElementById("searchInput").focus(), 200);
      }
    });

    /* SIDEBAR + THEME */
    const sidebar = document.getElementById("sidebar");
    const content = document.getElementById("content");

    document.getElementById("minimizeSidebarBtn").addEventListener("click", () => {
      sidebar.classList.toggle("minimized");
      content.classList.toggle("shifted");
    });

    document.getElementById("themeToggleBtn").addEventListener("click", () => {
      document.body.classList.toggle("dark-mode");
    });

    /* LANGUAGE UI */
    const ui = {
      ps: {
        sb_title: "لړۍ",
        sb_minimize: "لږول",
        sb_dashboard: "د پښتو په اړه",
        sb_calendar: "پښتانه",
        sb_table: "پښتنې سيمي",
        sb_pages: "پښتو نومونه",
        sb_settings: "سيټینګ",

        tb_theme: "تاريکه کول",
        tb_language: "ژبه",

        welcomeText: "خدای مو راوله",
        searchPlaceholder: "لټون…",
        searchButtonLabel: "لټون",
        noResult: "شئ لا ونېکه سته"
      },
      en: {
        sb_title: "LiST",
        sb_minimize: "Minimize",
        sb_dashboard: "About Pashto",
        sb_calendar: "Pashtuns",
        sb_table: "The Pashtun Belt",
        sb_pages: "Pashto names",
        sb_settings: "Settings",

        tb_theme: "Dark Mode",
        tb_language: "Language",

        welcomeText: "Welcome",
        searchPlaceholder: "Search…",
        searchButtonLabel: "Search",
        noResult: "No results found"
      }
    };

    function updateLanguage(lang) {
      currentLang = lang;
      const map = ui[lang];

      document.getElementById("sb_title").textContent = map.sb_title;
      document.getElementById("sb_minimize").textContent = map.sb_minimize;
      document.getElementById("sb_dashboard").textContent = map.sb_dashboard;
      document.getElementById("sb_calendar").textContent = map.sb_calendar;
      document.getElementById("sb_table").textContent = map.sb_table;
      document.getElementById("sb_pages").textContent = map.sb_pages;
      document.getElementById("sb_settings").textContent = map.sb_settings;

      document.getElementById("tb_theme").textContent = map.tb_theme;
      document.getElementById("tb_language").textContent = map.tb_language;

      document.getElementById("welcomeText").textContent = map.welcomeText;
      document.getElementById("searchInput").placeholder = map.searchPlaceholder;
      document.getElementById("searchButtonLabel").textContent = map.searchButtonLabel;

      if (lang === "ps") {
        document.body.setAttribute("dir", "rtl");
        document.body.classList.remove("ltr");
        document.body.classList.add("rtl");
      } else {
        document.body.setAttribute("dir", "ltr");
        document.body.classList.remove("rtl");
        document.body.classList.add("ltr");
      }
    }

    document.querySelectorAll(".lang-option").forEach(btn => {
      btn.addEventListener("click", () => {
        updateLanguage(btn.dataset.lang);
      });
    });
  </script>

</body>
</html>
